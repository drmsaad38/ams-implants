<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMS Implants and orthobiologics</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --section-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #0284c7; 
            --accent-light: #e0f2fe;
            --border: #e2e8f0;
            --sidebar-width: 310px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Top Header Navigation Ribbon */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 4%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 90;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .logo span {
            color: var(--accent);
        }

        .menu-trigger {
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }

        .menu-trigger:hover {
            border-color: var(--accent);
            background: var(--accent-light);
            color: var(--accent);
        }

        /* Hierarchical Collapsible Sidebar Navigation Panel */
        .sidebar {
            position: fixed;
            top: 0;
            left: calc(-1 * var(--sidebar-width));
            width: var(--sidebar-width);
            height: 100vh;
            background: #ffffff;
            border-right: 1px solid var(--border);
            z-index: 200;
            padding: 2.5rem 1.75rem;
            overflow-y: auto;
            transition: var(--transition);
            box-shadow: 15px 0 40px rgba(15, 23, 42, 0.08);
        }

        .sidebar.open {
            left: 0;
        }

        .close-sidebar {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.75rem;
            cursor: pointer;
            float: right;
            margin-bottom: 1rem;
            line-height: 1;
        }

        .close-sidebar:hover {
            color: var(--text-main);
        }

        .sidebar-brand {
            font-weight: 700;
            margin-bottom: 2.5rem;
            clear: both;
            font-size: 1.15rem;
            color: var(--accent);
            line-height: 1.4;
            border-bottom: 2px solid var(--accent-light);
            padding-bottom: 1rem;
        }

        .menu-group {
            margin-bottom: 2rem;
        }

        .menu-heading {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-main);
            margin-bottom: 0.75rem;
            font-weight: 700;
        }

        .menu-links {
            list-style: none;
        }

        .menu-links li {
            margin-bottom: 0.5rem;
        }

        .menu-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            transition: var(--transition);
            display: block;
            padding: 0.25rem 0;
        }

        .menu-links a:hover {
            color: var(--accent);
            padding-left: 6px;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(4px);
            z-index: 150;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Hero Framework with Building Layout Overlay Background */
        .hero-container {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            min-height: 100vh;
            padding: 0 6%;
            align-items: center;
            margin-top: 50px;
            gap: 2rem;
            background-image: linear-gradient(to right, rgba(255,255,255,0.96) 50%, rgba(255,255,255,0.75) 100%), url('https://unsplash.com');
            background-size: cover;
            background-position: right center;
        }

        .hero-text h1 {
            font-size: clamp(2.2rem, 4.5vw, 3.8rem);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            letter-spacing: -1.5px;
            color: #0f172a;
        }

        .hero-text h1 .brand-title {
            display: block;
            font-size: clamp(3.2rem, 6.5vw, 6rem);
            color: var(--accent);
            margin-bottom: 0.5rem;
            letter-spacing: -2px;
        }

        .hero-text p {
            color: var(--text-muted);
            font-size: 1.15rem;
            margin-bottom: 2rem;
            max-width: 540px;
        }

        /* Canvas Frame Block Container Details */
        .canvas-container {
            width: 100%;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            border: 1px solid var(--border);
            backdrop-filter: blur(4px);
            padding: 10px;
        }

        #cageCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Core Section Elements */
        section {
            padding: 7rem 6%;
        }

        #mission {
            background-color: var(--section-bg);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 2.5rem;
            letter-spacing: -0.75px;
            position: relative;
            padding-bottom: 0.5rem;
            color: var(--text-main);
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 4px;
            background: var(--accent);
            border-radius: 2px;
        }

        #mission .mission-content {
            max-width: 850px;
            font-size: 1.25rem;
            color: #334155;
            line-height: 1.8;
        }

        /* Executive Team Directories */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .team-member {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2.2rem 2rem;
            border-radius: 10px;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }

        .team-member:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 12px 20px -3px rgba(2, 132, 199, 0.08);
        }

        .member-header {
            margin-bottom: 1.25rem;
        }

        .member-role {
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            margin-bottom: 0.6rem;
        }

        .member-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.4rem;
        }

        .member-title {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 400;
            line-height: 1.4;
        }

        .member-affiliation {
            font-size: 0.85rem;
            color: #475569;
            background-color: var(--section-bg);
            border-top: 1px solid var(--border);
            padding: 0.75rem 1rem;
            margin-top: auto;
            font-style: italic;
            border-radius: 4px;
        }

        @media (max-width: 950px) {
            .hero-container {
                grid-template-columns: 1fr;
                padding-top: 80px;
                text-align: center;
